<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VortixWorld Log Console</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1e1e1e;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* ========== NEUMORPHIC COMPONENTS (shared) ========== */
    .header, .toolbar, .stats, .url-group, .filter-btn, .clear-btn, .search-box {
      background: #1e1e1e;
      box-shadow: 8px 8px 16px #141414, -8px -8px 16px #282828;
    }
    .filter-btn.active, .filter-btn:active, .clear-btn:active {
      box-shadow: inset 4px 4px 8px #141414, inset -4px -4px 8px #282828;
    }
    .stats, .search-box {
      box-shadow: inset 2px 2px 5px #141414, inset -2px -2px 5px #282828;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding: 16px 24px;
      border-radius: 60px;
    }
    .header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 4px 4px 8px #141414, -4px -4px 8px #282828;
    }
    .badge {
      background: #2a2a32;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      box-shadow: inset 1px 1px 2px #141414, inset -1px -1px 2px #282828;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
      padding: 16px 24px;
      border-radius: 60px;
      align-items: center;
    }
    .filter-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-btn {
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      color: #e0e0e0;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s ease;
      font-size: 0.85rem;
    }
    .filter-btn.active {
      background: #2a2a32;
      color: #4ade80;
    }
    .search-box {
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      color: #e0e0e0;
      width: 260px;
      font-size: 0.85rem;
      outline: none;
    }
    .clear-btn {
      border: none;
      padding: 8px 24px;
      border-radius: 40px;
      color: #ef4444;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
      font-size: 0.85rem;
    }
    .stats {
      padding: 12px 20px;
      border-radius: 40px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-block;
    }

    /* URL Group */
    .url-group {
      border-radius: 28px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .url-header {
      background: #1e1e1e;
      padding: 16px 24px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-family: monospace;
      font-size: 0.85rem;
      border-bottom: 1px solid #2a2a32;
      transition: background 0.1s;
      user-select: none;
    }
    .url-header:hover {
      background: #26262e;
    }
    .url-text {
      flex: 1;
      word-break: break-all;
      white-space: normal;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chevron {
      font-size: 1rem;
      display: inline-block;
      width: 20px;
      text-align: center;
      transition: transform 0.2s;
    }
    .url-count {
      background: #2a2a32;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: inset 1px 1px 2px #141414, inset -1px -1px 2px #282828;
    }
    .log-list {
      display: none;
      flex-direction: column;
      background: #1e1e1e;
    }
    .log-list.open {
      display: flex;
    }

    /* ========== DESKTOP LAYOUT (default) ========== */
    .log-entry {
      padding: 14px 24px;
      border-bottom: 1px solid #2a2a32;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
      font-size: 0.85rem;
      transition: background 0.1s;
    }
    .log-entry:hover {
      background: #25252d;
    }
    .log-level {
      width: 90px;
      font-weight: 800;
      text-transform: uppercase;
      flex-shrink: 0;
      font-size: 0.8rem;
    }
    .log-level.info { color: #22c55e; }
    .log-level.warn { color: #f59e0b; }
    .log-level.error { color: #ef4444; }
    .log-level.websocket { color: #a855f7; }
    .log-content {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .log-message {
      font-weight: 500;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .log-data {
      color: #9ca3af;
      font-family: monospace;
      font-size: 0.7rem;
      margin-top: 4px;
      word-break: break-all;
    }
    .log-time {
      color: #6b7280;
      font-size: 0.7rem;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: monospace;
    }

    /* ========== MOBILE LAYOUT (different structure) ========== */
    @media (max-width: 700px) {
      body {
        padding: 12px;
      }
      .header {
        padding: 12px 16px;
        margin-bottom: 16px;
        border-radius: 40px;
      }
      .header h1 {
        font-size: 1.2rem;
      }
      .header-icon {
        width: 32px;
        height: 32px;
      }
      .badge {
        font-size: 0.65rem;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
        padding: 14px;
        gap: 12px;
        border-radius: 40px;
      }
      .filter-group {
        justify-content: center;
      }
      .filter-btn {
        padding: 6px 14px;
        font-size: 0.7rem;
      }
      .search-box {
        width: 100%;
        font-size: 0.75rem;
      }
      .clear-btn {
        margin-left: 0;
        text-align: center;
      }
      .stats {
        font-size: 0.7rem;
        width: 100%;
        text-align: center;
        padding: 8px 12px;
      }
      /* Mobile: each log entry as a card-like block */
      .url-header {
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      .url-text {
        font-size: 0.7rem;
        width: 100%;
        gap: 8px;
      }
      .chevron {
        font-size: 0.8rem;
        width: 16px;
      }
      .log-entry {
        flex-direction: column;
        padding: 12px 16px;
        gap: 6px;
      }
      .log-level {
        width: auto;
        font-size: 0.7rem;
        margin-bottom: 4px;
      }
      .log-message {
        font-size: 0.75rem;
      }
      .log-data {
        font-size: 0.65rem;
      }
      .log-time {
        white-space: normal;
        font-size: 0.65rem;
        text-align: left;
        margin-top: 4px;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #141414;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a3a44;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>
      <img src="https://i.ibb.co/LdshK1fR/461-F6268-08-F3-4-E8A-BC73-409218-A3-F168.jpg" class="header-icon" alt="VW Icon">
      VortixWorld Log Console
    </h1>
    <span class="badge">live from userscript</span>
  </div>

  <div class="toolbar">
    <div class="filter-group">
      <button data-level="all" class="filter-btn active">All</button>
      <button data-level="info" class="filter-btn">Info</button>
      <button data-level="warn" class="filter-btn">Warn</button>
      <button data-level="error" class="filter-btn">Error</button>
      <button data-level="websocket" class="filter-btn">WebSocket</button>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search in messages...">
    <button id="clearLogsBtn" class="clear-btn">🗑️ Clear all logs</button>
  </div>

  <div class="stats" id="stats">📊 Loading logs...</div>
  <div id="logGroupsContainer"></div>
</div>

<script>
  let allLogs = [];
  let currentFilter = 'all';
  let searchQuery = '';

  async function fetchLogs() {
    try {
      const res = await fetch('/api/logs');
      allLogs = await res.json();
      render();
    } catch (err) {
      console.error(err);
      document.getElementById('stats').innerText = '⚠️ Failed to fetch logs';
    }
  }

  async function clearLogs() {
    if (!confirm('Delete all logs from server?')) return;
    await fetch('/api/logs', { method: 'DELETE' });
    fetchLogs();
  }

  function render() {
    let filtered = allLogs;
    if (currentFilter !== 'all') {
      filtered = filtered.filter(log => log.level === currentFilter);
    }
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(log => 
        log.message.toLowerCase().includes(q) || 
        (log.data && String(log.data).toLowerCase().includes(q))
      );
    }

    // group by pageUrl
    const groups = new Map();
    for (const log of filtered) {
      const url = log.pageUrl || 'unknown';
      if (!groups.has(url)) groups.set(url, []);
      groups.get(url).push(log);
    }

    const statsDiv = document.getElementById('stats');
    statsDiv.innerText = `📊 ${filtered.length} logs shown (${allLogs.length} total) · ${groups.size} unique URLs`;

    const container = document.getElementById('logGroupsContainer');
    // Preserve open/closed states if re-rendering
    const openStates = new Map();
    const existingGroups = container.querySelectorAll('.url-group');
    existingGroups.forEach(group => {
      const header = group.querySelector('.url-header');
      const urlTextSpan = header?.querySelector('.url-text span:last-child');
      if (urlTextSpan) {
        const url = urlTextSpan.textContent;
        const logList = group.querySelector('.log-list');
        if (logList && logList.classList.contains('open')) {
          openStates.set(url, true);
        }
      }
    });

    container.innerHTML = '';

    for (const [url, logsArray] of groups.entries()) {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'url-group';

      const header = document.createElement('div');
      header.className = 'url-header';
      
      const urlSpan = document.createElement('span');
      urlSpan.className = 'url-text';
      
      const chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.textContent = '▶';
      
      const urlTextSpan = document.createElement('span');
      urlTextSpan.textContent = escapeHtml(url);
      urlTextSpan.style.flex = '1';
      urlTextSpan.style.wordBreak = 'break-all';
      
      urlSpan.appendChild(chevron);
      urlSpan.appendChild(urlTextSpan);
      
      const countSpan = document.createElement('span');
      countSpan.className = 'url-count';
      countSpan.textContent = `${logsArray.length} logs`;
      
      header.appendChild(urlSpan);
      header.appendChild(countSpan);
      
      const logList = document.createElement('div');
      logList.className = 'log-list';
      
      // restore open state if it existed
      const wasOpen = openStates.get(url);
      if (wasOpen) {
        logList.classList.add('open');
        chevron.textContent = '▼';
      }

      for (const log of logsArray) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `
          <div class="log-level ${log.level}">${log.level.toUpperCase()}</div>
          <div class="log-content">
            <div class="log-message">${escapeHtml(log.message)}</div>
            ${log.data ? `<div class="log-data">📎 ${escapeHtml(String(log.data))}</div>` : ''}
          </div>
          <div class="log-time">🕒 ${new Date(log.timestamp).toLocaleString()}</div>
        `;
        logList.appendChild(entry);
      }

      // Toggle without any page jump
      header.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (logList.classList.contains('open')) {
          logList.classList.remove('open');
          chevron.textContent = '▶';
        } else {
          logList.classList.add('open');
          chevron.textContent = '▼';
        }
      });

      groupDiv.appendChild(header);
      groupDiv.appendChild(logList);
      container.appendChild(groupDiv);
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Event listeners
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-level');
      render();
    });
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    render();
  });
  document.getElementById('clearLogsBtn').addEventListener('click', clearLogs);

  fetchLogs();
  setInterval(fetchLogs, 3000);
</script>
</body>
</html>
